[package]
name = "lm4f120-hal"
version = "0.1.0"
edition = "2021"
description = "embedded-hal drivers for the TI Stellaris LM4F120H5QR (Tiva-C class) MCU"
license = "MIT OR Apache-2.0"

[dependencies]
embedded-hal = "1.0"
embedded-io = "0.6"

[dev-dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

[profile.release]
opt-level = "s"
lto = true
